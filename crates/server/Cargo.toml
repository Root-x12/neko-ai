[package]
name = "neko-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "neko_server"
path = "src/lib.rs"

[[bin]]
name = "neko-ai"
path = "src/main.rs"

[dependencies]
neko-shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "fs", "process", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
anyhow = "1"
scraper = "0.29"
pdf-extract = "0.12"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
