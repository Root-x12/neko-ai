<!DOCTYPE html>
<html lang="en" data-mode="neko" data-variant="sakura" data-scheme="light" data-motion="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fff6f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Neko AI" />
  <meta name="description" content="Self-hosted chat for any AI provider" />
  <title>Neko AI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link data-trunk rel="css" href="style/main.css" />
  <link data-trunk rel="copy-file" href="assets/favicon.svg" />
  <link data-trunk rel="copy-file" href="assets/icon-192.png" />
  <link data-trunk rel="copy-file" href="assets/icon-512.png" />
  <link data-trunk rel="copy-file" href="assets/manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="assets/sw.js" />
  <link data-trunk rel="copy-file" href="assets/highlight.min.js" />
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="neko-web" />

  <script>
    // Apply the saved theme before first paint (format: mode|neko|cyber|scheme|motion; see theme.rs).
    (function () {
      try {
        var p = (localStorage.getItem("neko.theme") || "").split("|");
        var mode = p[0] === "cyber" ? "cyber" : "neko";
        var variant = (mode === "cyber" ? p[2] : p[1]) || (mode === "cyber" ? "neon" : "sakura");
        var dark = p[3] === "dark" || ((p[3] || "system") === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var motion = p[4] === "0" ? "off" : p[4] === "1" ? "on" : (matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on");
        var r = document.documentElement;
        r.setAttribute("data-mode", mode);
        r.setAttribute("data-variant", variant);
        r.setAttribute("data-scheme", dark ? "dark" : "light");
        r.setAttribute("data-motion", motion);
      } catch (e) {}
    })();
    // Called from Rust after messages render.
    window.nekoHighlight = function () {
      if (!window.hljs) return;
      document.querySelectorAll(".md pre code:not([data-highlighted])").forEach(function (el) {
        try { window.hljs.highlightElement(el); } catch (e) {}
      });
    };
    if ("serviceWorker" in navigator && window.isSecureContext) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
    }
  </script>
  <script src="/highlight.min.js" defer></script>
</head>
<body></body>
</html>
