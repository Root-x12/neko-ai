name: Release

# Builds ready-to-run downloads. Push a tag like v0.1.0 to publish them as a GitHub release;
# running it by hand just keeps the zips as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build web UI
        run: |
          cargo install trunk --locked
          cd crates/web && trunk build --release && rm -f dist/.trunk-lock
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: crates/web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: neko-ai-windows-x64, exe: neko-ai.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, name: neko-ai-macos-apple-silicon, exe: neko-ai }
          - { os: macos-latest, target: x86_64-apple-darwin, name: neko-ai-macos-intel, exe: neko-ai }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: neko-ai-linux-x64, exe: neko-ai }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build server
        run: cargo build --release -p neko-server --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: pkg/${{ matrix.name }}/web
      - name: Package
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "pkg/${{ matrix.name }}/"
          cp packaging/README.txt "pkg/${{ matrix.name }}/README.txt"
          cd pkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.name }}.zip" "${{ matrix.name }}" > /dev/null
          else
            chmod +x "${{ matrix.name }}/${{ matrix.exe }}"
            zip -qr "${{ matrix.name }}.zip" "${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: pkg/${{ matrix.name }}.zip
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/${{ matrix.name }}.zip
