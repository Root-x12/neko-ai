[workspace]
resolver = "2"
members = ["crates/shared", "crates/server", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Root-x12/neko-ai"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Smaller wasm bundle for the web app.
[profile.release.package.neko-web]
opt-level = "z"
